<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elizabeth Ewudiwa - Executive Director at Bentinarly Foundation. HR Practitioner, Writer, and Social Advocate.">
    <meta property="og:title" content="Elizabeth Ewudiwa - Digital Business Card">
    <meta property="og:description" content="Connect with Elizabeth Ewudiwa - Executive Director at Bentinarly Foundation">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kytec.github.io/Business-card/">
    <title>Elizabeth Ewudiwa - Business Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://kytec.github.io/Business-card/">
</head>
<body>
    <div class="business-card">
        <div class="card-front">
            <div class="logo-container">
                <!-- Replace src with your actual logo path once you have it -->
                <img src="images/bcardlogo.jpg" alt="Bentinarly Foundation Logo" class="logo">
            </div>
            <h1 class="name">Elizabeth Ewudiwa</h1>
            <p class="titles">HR Practitioner | Writer | Social Advocate</p>
            <p class="position">Executive Director, Bentinarly Foundation</p>
            <div class="contact-info">
                <p><a href="mailto:elizabeth@bentinarly.org">elizabeth@bentinarly.org</a></p>
                <p><a href="mailto:elizabethewudiwa@gmail.com">elizabethewudiwa@gmail.com</a></p>
                <p><a href="tel:+233208886430" class="phone">Tel: +233 (0) 208886430</a></p>
                <p><a href="tel:+233543401716" class="phone">Mobile: +233 (0) 543401716</a></p>
            </div>
        </div>
    </div>
    <div class="qr-section">
        <button id="showQR" class="qr-button">Show QR Code</button>
        <div id="qrModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Scan QR Code to Save Contact</h2>
                <div id="qrcode"></div>
                <p class="qr-info">Scan this code to view the digital business card</p>
                <button id="downloadPDF" class="download-button">Download QR Code as PDF</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
